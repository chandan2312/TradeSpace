[project]
name = "quant-service"
version = "0.1.0"
description = "TradeSpace quantitative engine — vectorized bias, telemetry and backtesting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pymongo>=4.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
